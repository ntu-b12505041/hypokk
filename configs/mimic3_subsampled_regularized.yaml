project:
  name: "MIMIC-III Bedside ECG Dyskalemia - Regularized Rotating NK Subsample"
  seed: 20260730
  output_dir: "outputs/mimic3_lead2_se_resnet_subsampled_regularized"

data:
  clinical_root: "/data/mimiciii/1.4"
  waveform_root: "/data/mimic3wdb-matched/1.0"
  physionet_waveform_dir: "mimic3wdb-matched/1.0"
  waveform_index_csv: "data/interim/mimic3_waveform_index.csv"
  cohort_manifest_csv: "data/interim/mimic3_potassium_window_manifest.csv"
  materialized_cohort_csv: "data/processed/mimic3_materialized_cohort.csv"
  split_csv: "data/processed/mimic3_materialized_cohort_split.csv"
  waveform_cache_dir: "/data/mimic3_selective_windows"
  mimic_waveform_version: "1.0"
  mimic_clinical_version: "1.4"
  lab_window_minutes: 60
  minimum_window_separation_seconds: 30
  include_whole_blood: false
  potassium_itemids:
    serum: [50971]
    whole_blood: [50822]
  min_potassium: 1.5
  max_potassium: 10.0
  lead_order: ["II"]

labels:
  hypokalemia_upper: 3.5
  hyperkalemia_lower: 5.5
  hypokalemia_inclusive: false
  hyperkalemia_inclusive: true
  names: ["HypoK", "NK", "HyperK"]

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  group_column: "subject_id"
  label_column: "label_id"

preprocess:
  target_sampling_rate: 125
  duration_seconds: 10
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0
  notch_hz: 60.0
  notch_quality_factor: 30.0
  clip_millivolts: 5.0
  remove_baseline: true
  apply_notch: false
  normalization: "none"
  profile: "standard"

augmentation:
  enabled: true
  gaussian_noise_std_millivolts: 0.01
  max_time_shift_seconds: 0.08
  lead_dropout_probability: 0.0
  amplitude_scale_range: [1.0, 1.0]

sampling:
  enabled: true
  strategy: "rotating_train_subsample"
  class_name: "NK"
  windows_per_epoch: 8000
  max_windows_per_subject_per_class_per_epoch: 10
  save_epoch_manifests: true

model:
  name: "se_resnet1d_multitask"
  input_leads: 1
  base_channels: 64
  stage_blocks: [2, 2, 2, 2]
  kernel_size: 7
  dropout: 0.30
  se_reduction: 16
  num_classes: 3
  potassium_center: 4.3
  potassium_scale: 1.0
  pretrained_checkpoint: null
  freeze_backbone_epochs: 0

training:
  device: "auto"
  epochs: 40
  batch_size: 128
  num_workers: 8
  learning_rate: 0.0003
  weight_decay: 0.0005
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 2
  mixed_precision: true
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  monitor: "val_macro_auroc_ovr"
  class_weight_method: "sqrt_inverse_frequency"
  label_smoothing: 0.02
  loss_weights:
    classification: 1.0
    ordinal: 0.30
    regression: 0.20

calibration:
  temperature_scaling: true
  threshold_grid_size: 151
  target_recall: 0.85
  target_specificity: 0.85
  selection_metric: "minimum_recall_specificity"

evaluation:
  bootstrap_iterations: 2000
  bootstrap_confidence_level: 0.95
  bootstrap_unit: "subject_id"
  save_predictions: true
  decision_curve: false
