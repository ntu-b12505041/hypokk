project:
  name: "MIMIC-III Demo Bedside ECG Dyskalemia"
  seed: 20260730
  output_dir: "outputs/mimic3_demo"

data:
  clinical_root: "/data/mimiciii-demo/1.4"
  waveform_root: "/data/mimic3wdb-matched/1.0"
  physionet_waveform_dir: "mimic3wdb-matched/1.0"
  waveform_index_csv: "data/demo/mimic3_waveform_index.csv"
  cohort_manifest_csv: "data/demo/mimic3_demo_manifest.csv"
  materialized_cohort_csv: "data/demo/mimic3_demo_materialized.csv"
  split_csv: "data/demo/mimic3_demo_split.csv"
  waveform_cache_dir: "/data/mimic3_demo_windows"
  mimic_waveform_version: "1.0"
  mimic_clinical_version: "1.4"
  lab_window_minutes: 60
  minimum_window_separation_seconds: 30
  include_whole_blood: false
  potassium_itemids:
    serum: [50971]
    whole_blood: [50822]
  min_potassium: 1.5
  max_potassium: 10.0
  lead_order: ["II"]

labels:
  hypokalemia_upper: 3.5
  hyperkalemia_lower: 5.5
  hypokalemia_inclusive: false
  hyperkalemia_inclusive: true
  names: ["HypoK", "NK", "HyperK"]

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  group_column: "subject_id"
  label_column: "label_id"

preprocess:
  target_sampling_rate: 125
  duration_seconds: 10
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0
  notch_hz: 60.0
  notch_quality_factor: 30.0
  clip_millivolts: 5.0
  remove_baseline: true
  apply_notch: false
  normalization: "none"
  profile: "standard"

augmentation:
  enabled: true
  gaussian_noise_std_millivolts: 0.01
  max_time_shift_seconds: 0.08
  lead_dropout_probability: 0.0
  amplitude_scale_range: [1.0, 1.0]

model:
  name: "se_resnet1d_multitask"
  input_leads: 1
  base_channels: 16
  stage_blocks: [1, 1, 1]
  kernel_size: 7
  dropout: 0.20
  se_reduction: 8
  num_classes: 3
  potassium_center: 4.3
  potassium_scale: 1.0
  pretrained_checkpoint: null
  freeze_backbone_epochs: 0

training:
  device: "auto"
  epochs: 3
  batch_size: 16
  num_workers: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 0
  mixed_precision: true
  gradient_clip_norm: 1.0
  early_stopping_patience: 2
  monitor: "val_macro_auroc"
  class_weight_method: "effective_number"
  effective_number_beta: 0.99
  label_smoothing: 0.02
  loss_weights:
    classification: 1.0
    ordinal: 0.30
    regression: 0.20

calibration:
  temperature_scaling: true
  threshold_grid_size: 31
  target_recall: 0.85
  target_specificity: 0.85
  selection_metric: "minimum_recall_specificity"

evaluation:
  bootstrap_iterations: 100
  bootstrap_confidence_level: 0.95
  bootstrap_unit: "subject_id"
  save_predictions: true
  decision_curve: false
